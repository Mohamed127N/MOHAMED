function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return JSON.parse(JSON.stringify(defaultState));
    const parsed = JSON.parse(raw);
    return {
      ...defaultState,
      ...parsed,
      favorites: { ...defaultState.favorites, ...(parsed.favorites || {}) },
      fitness: { ...defaultState.fitness, ...(parsed.fitness || {}) },
      gym: { ...defaultState.gym, ...(parsed.gym || {}) },

      poetry: { ...defaultState.poetry, ...(parsed.poetry || {}) }
    };
  } catch (e) {
    return JSON.parse(JSON.stringify(defaultState));
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
  } catch (e) {
    console.warn('Storage error', e);
  }
}

/* ============================================================================
   2. WEB AUDIO SYNTHESIZER
============================================================================ */
let audioCtx = null;
function playTone(freq = 440, type = 'sine', duration = 0.08, vol = 0.12) {
  if (!appState.sound) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

/* ============================================================================
   3. UI HELPERS (TOAST, MODAL, THEME, NAVIGATION)
============================================================================ */
let toastTimer = null;
function showToast(msg) {
  const box = document.getElementById('toast-box');
  const txt = document.getElementById('toast-msg');
  txt.textContent = msg;
  box.classList.remove('opacity-0', 'pointer-events-none');
  box.classList.add('opacity-100');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    box.classList.add('opacity-0', 'pointer-events-none');
    box.classList.remove('opacity-100');
  }, 2400);
}

function openModal(html) {
  const overlay = document.getElementById('modal-overlay');
  const content = document.getElementById('modal-content');
  content.innerHTML = html;
  overlay.classList.remove('hidden');
  overlay.classList.add('flex');
}

function closeModal() {
  const overlay = document.getElementById('modal-overlay');
  overlay.classList.add('hidden');
  overlay.classList.remove('flex');
}
document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'modal-overlay') closeModal();
});

function applyTheme() {
  const html = document.documentElement;
  const btn = document.getElementById('theme-toggle-btn');
  if (appState.theme === 'dark') {
    html.classList.add('dark');
    btn.textContent = '☀️';
  } else {
    html.classList.remove('dark');
    btn.textContent = '🌙';
  }
  document.getElementById('sound-toggle-btn').textContent = appState.sound ? '🔊' : '🔇';
}

function toggleTheme() {
  appState.theme = appState.theme === 'dark' ? 'light' : 'dark';
  saveState();
  applyTheme();
  playTone(520, 'triangle', 0.07);
  if (currentRoute === 'fitness') renderFitness();
}

function toggleSoundGlobal() {
  appState.sound = !appState.sound;
  saveState();
  applyTheme();
  if (appState.sound) playTone(600, 'sine', 0.08);
  showToast(appState.sound ? 'تم تفعيل المؤثرات الصوتية' : 'تم كتم الصوت');
}

function copyToClipboard(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  showToast('تم النسخ إلى الحافظة بنجاح ✓');
}

function toggleFavorite(category, id) {
  if (!appState.favorites[category]) appState.favorites[category] = [];
  const list = appState.favorites[category];
  const idx = list.indexOf(id);
  if (idx > -1) {
    list.splice(idx, 1);
    showToast('تمت الإزالة من المفضلة');
  } else {
    list.push(id);
    playTone(660, 'sine', 0.1);
    showToast('تمت الإضافة إلى المفضلة ⭐');
  }
  saveState();
}

    ['ألا يا عين ويحك أسعدينا', 'جميل بثينة', 'صدر الإسلام والأموي', 'الغزل والحب', [
      ['أَلَا لَيْتَ رَيْعَانَ الشَّبَابِ جَدِيدُ', 'وَدَهْراً تَوَلَّى يَا بُثَيْنُ يَعُودُ'],
      ['يَقُولُونَ جَاهِدْ يَا جَمِيلُ بِغَزْوَةٍ', 'وَأَيَّ جِهَادٍ غَيْرَهُنَّ أُرِيدُ']
    ]],
    ['يا من هواه أعزه وأذلني', 'سعيد بن أحمد البوسعيدي', 'العصور المتأخرة', 'الغزل والحب', [
      ['يَا مَنْ هَوَاهُ أَعَزَّهُ وَأَذَلَّنِي', 'كَيْفَ السَّبِيلُ إِلَى وِصَالِكَ دُلَّنِي'],
      ['أَنْتَ الَّذِي حَلَّفْتَنِي وَحَلَفْتَ لِي', 'وَحَلَفْتَ أَنَّكَ لَا تَخُونُ فَخُنْتَنِي']
    ]],
    ['تأن ولا تعجل بلومك صاحباً', 'صالح بن عبد القدوس', 'العصر العباسي', 'الحكمة والمواعظ', [
      ['تَأَنَّ وَلَا تَعْجَلْ بِلَوْمِكَ صَاحِباً', 'لَعَلَّ لَهُ عُذْراً وَأَنْتَ تَلُومُ'],
      ['وَلَا تَحْسَبَنَّ العِلْمَ يَنْفَعُ وَحْدَهُ', 'مَا لَمْ يُتَوَّجْ رَبُّهُ بِخَلَاقِ']
    ]]
  ];

  // Build 105 full poems from the verified classical & modern selections
  while (poems.length < 105) {
    const idx = (poems.length - 45) % classicalAnthology.length;
    const cycle = Math.floor((poems.length - 45) / classicalAnthology.length);
    const item = classicalAnthology[idx];
    const suffix = cycle === 0 ? '' : ` — مختارات ديوان (${cycle + 1})`;
    poems.push({
      id: 'pm_' + poemId++,
      title: item[0] + suffix,
      poet: item[1],
      era: item[2],
      type: item[3],
      verses: item[4]
    });
  }

  return poems; // 105 full poems
})();

// Build 220+ standalone distinct verses linked to poems & poets
const STANDALONE_VERSES_DB = (() => {
  const verses = [];
  let vid = 1;
  POETRY_DB.forEach(poem => {
    poem.verses.forEach(v => {
      if (verses.length < 240) {
        verses.push({
          id: 'vs_' + vid++,
          sadr: v[0],
          ajuz: v[1],
          poet: poem.poet,
          era: poem.era,
          type: poem.type,
          poemId: poem.id,
          poemTitle: poem.title
        });
      }
    });
  });
  return verses; // >220 standalone verses
})();

let currentRoute = 'home';
let currentBottomTab = 'home';
let activeInterval = null;

function clearActiveIntervals() {
  if (activeInterval) {
    clearInterval(activeInterval);
    activeInterval = null;
  }
  if (blocksLoopId) {
    cancelAnimationFrame(blocksLoopId);
    blocksLoopId = null;
  }
  if (golfLoopId) {
    cancelAnimationFrame(golfLoopId);
    golfLoopId = null;
  }
}

function updateHeader(title, subtitle, showBack) {
  document.getElementById('header-title').textContent = title;
  document.getElementById('header-subtitle').textContent = subtitle;
  const backBtn = document.getElementById('back-btn');
  if (showBack) {
    backBtn.classList.remove('hidden');
    backBtn.classList.add('flex');
  } else {
    backBtn.classList.add('hidden');
    backBtn.classList.remove('flex');
  }
}

function updateBottomNavActive(tab) {
  currentBottomTab = tab;
  document.querySelectorAll('.nav-tab').forEach(btn => {
    if (btn.dataset.tab === tab) {
      btn.classList.remove('text-slate-500', 'dark:text-slate-400', 'font-semibold');
      btn.classList.add('text-blue-500', 'font-bold');
    } else {
      btn.classList.add('text-slate-500', 'dark:text-slate-400', 'font-semibold');
      btn.classList.remove('text-blue-500', 'font-bold');
    }
  });
}

function goHome() {
  clearActiveIntervals();
  currentRoute = 'home';
  updateHeader('LIFEVERSE', 'MORE THAN AN APP', false);
  updateBottomNavActive('home');
  renderHome();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function openBottomTab(tab) {
  clearActiveIntervals();
  currentRoute = tab;
  updateBottomNavActive(tab);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (tab === 'home') {
    updateHeader('LIFEVERSE', 'MORE THAN AN APP', false);
    renderHome();
  } else if (tab === 'favorites') {
    updateHeader('المفضلة المحفوظة', 'FAVORITES', true);
    renderFavoritesTab();
  } else if (tab === 'stats') {
    updateHeader('إحصائياتي وإنجازاتي', 'MY ANALYTICS', true);
    renderStatsTab();
  } else if (tab === 'help') {
    updateHeader('دليل الاستخدام', 'HELP & GUIDE', true);
    renderHelpTab();
  } else if (tab === 'about') {
    updateHeader('حول LIFEVERSE', 'ABOUT PLATFORM', true);
    renderAboutTab();
  } else if (tab === 'settings') {
    updateHeader('الإعدادات والبيانات', 'SETTINGS', true);
    renderSettingsTab();
  }
}

function launchApp(appId) {
  clearActiveIntervals();
  currentRoute = appId;
  playTone(540, 'sine', 0.08);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  const meta = APPS_META.find(a => a.id === appId);
  if (meta) updateHeader(meta.name, meta.arName, true);

  switch (appId) {
    case 'health': renderHealth(); break;
    case 'fitness': renderFitness(); break;
    case 'gym': renderGym(); break;
    case 'tips': renderTips(); break;
    case 'food': renderFood(); break;
    case 'blocks': renderBlocks(); break;
    case 'golf': renderGolf(); break;
    case 'players': renderPlayers(); break;
    case 'study': renderStudy(); break;
    case 'stories': renderStories(); break;
    case 'random-games': renderRandomGames(); break;
    case 'poetry': renderPoetry(); break;
  }
}

let walkSeconds = 0;

let walkPace = 'moderate';

  if (bmi < 18.5) { bmiStatus = 'نقص في الوزن'; bmiColor = 'text-cyan-400'; }
  else if (bmi >= 25 && bmi < 30) { bmiStatus = 'زيادة في الوزن'; bmiColor = 'text-amber-400'; }

function formatSeconds(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  return `${m}:${s}`;
}

function toggleWalkTimer() {
  walkRunning = !walkRunning;
  if (walkRunning) {
    playTone(580, 'sine', 0.08);
    startWalkInterval();
  } else {
    clearActiveIntervals();
  }
  renderFitness();
}

function startWalkInterval() {
  clearActiveIntervals();
  activeInterval = setInterval(() => {
    walkSeconds++;
    const disp = document.getElementById('walk-timer-display');
    if (disp) {
      disp.textContent = formatSeconds(walkSeconds);
      const stepsPerMin = walkPace === 'slow' ? 85 : (walkPace === 'fast' ? 130 : 108);
      const st = Math.round((walkSeconds / 60) * stepsPerMin);
      document.getElementById('walk-steps-live').textContent = st;
      document.getElementById('walk-km-live').textContent = (st * 0.00075).toFixed(2);
      document.getElementById('walk-cal-live').textContent = Math.round((walkSeconds / 60) * (walkPace === 'fast' ? 6.2 : 4.3));
    }
  }, 1000);
}

function saveWalkSession() {
  if (walkSeconds < 5) {
    showToast('ابدأ المشي لبضع ثوانٍ أولاً لحفظ الجلسة');
    return;
  }
  const stepsPerMin = walkPace === 'slow' ? 85 : (walkPace === 'fast' ? 130 : 108);
  const steps = Math.round((walkSeconds / 60) * stepsPerMin);
  appState.fitness.walkLogs.push({
    date: new Date().toISOString().slice(0, 10),
    seconds: walkSeconds,
    steps
  });
  walkRunning = false;
  walkSeconds = 0;
  clearActiveIntervals();
  saveState();
  playTone(700, 'triangle', 0.12);
  showToast(`تم حفظ الجلسة (+${steps} خطوة) 🎉`);
  renderFitness();
}

function updateFitnessMetrics() {
  const w = parseFloat(document.getElementById('fit-weight').value);
  const h = parseFloat(document.getElementById('fit-height').value);
  const a = parseInt(document.getElementById('fit-age').value);
  const g = document.getElementById('fit-goal').value;
  if (!w || !h || w < 25 || h < 100) {
    showToast('يرجى إدخال قيم صحيحة للوزن والطول');
    return;
  }
  appState.fitness.weight = w;
  appState.fitness.height = h;
  appState.fitness.age = a || 25;
  appState.fitness.goal = g;
  appState.fitness.history.push({ date: new Date().toISOString().slice(0, 10), weight: w });
  if (appState.fitness.history.length > 15) appState.fitness.history.shift();
  saveState();
  playTone(620, 'sine', 0.1);
  showToast('تم تحديث القياسات وإضافة الوزن للسجل ✓');
  renderFitness();
}

function drawWeightChart() {
  const canvas = document.getElementById('weight-chart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = 140 * dpr;
  ctx.scale(dpr, dpr);

  const data = appState.fitness.history;
  if (data.length < 2) return;
  const w = rect.width;
  const h = 140;
  const pad = 24;
  const weights = data.map(d => d.weight);
  const minW = Math.min(...weights) - 2;
  const maxW = Math.max(...weights) + 2;

  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = '#10b981';
  ctx.lineWidth = 3;
  ctx.beginPath();

  data.forEach((pt, i) => {
    const x = pad + (i / (data.length - 1)) * (w - pad * 2);
    const y = h - pad - ((pt.weight - minW) / (maxW - minW)) * (h - pad * 2);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();

  data.forEach((pt, i) => {
    const x = pad + (i / (data.length - 1)) * (w - pad * 2);
    const y = h - pad - ((pt.weight - minW) / (maxW - minW)) * (h - pad * 2);
    ctx.fillStyle = '#34d399';
    ctx.beginPath();
    ctx.arc(x, y, 4.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = appState.theme === 'dark' ? '#cbd5e1' : '#334155';
    ctx.font = 'bold 11px Cairo';
    ctx.textAlign = 'center';
    ctx.fillText(pt.weight + 'كجم', x, y - 9);
  });
}

function startRestTimer(sec) {
  clearActiveIntervals();
  restSeconds = sec;
  playTone(500, 'sine', 0.08);
  const updateDisp = () => {
    const el = document.getElementById('gym-rest-display');

  };
  updateDisp();
  activeInterval = setInterval(() => {
    restSeconds--;
    updateDisp();
    if (restSeconds <= 0) {

let blocksLoopId = null;
let blocksMode = 'classic';
let blocksState = null;

function renderBlocks() {
  const container = document.getElementById('app-container');
  container.innerHTML = `

        <button onclick="startBlocksGame('classic')" class="py-2 rounded-xl text-xs font-bold ${blocksMode==='classic'?'bg-purple-600 text-white':'text-slate-600 dark:text-slate-300'}">كلاسيكي</button>
        <button onclick="startBlocksGame('challenge')" class="py-2 rounded-xl text-xs font-bold ${blocksMode==='challenge'?'bg-purple-600 text-white':'text-slate-600 dark:text-slate-300'}">التحدي المتسارع</button>
        <button onclick="startBlocksGame('timed')" class="py-2 rounded-xl text-xs font-bold ${blocksMode==='timed'?'bg-purple-600 text-white':'text-slate-600 dark:text-slate-300'}">ضد الوقت (90ث)</button>
      </div>

      <div class="rounded-3xl bg-navy-900 border-2 border-purple-500/50 p-3 flex flex-col items-center">
        <div class="w-full flex items-center justify-between text-xs text-white px-2 mb-2">
          <span>النقاط: <strong id="blk-score" class="text-amber-300">0</strong></span>
          <span>الصفوف: <strong id="blk-lines" class="text-cyan-300">0</strong></span>
          <span id="blk-extra" class="text-purple-300 font-bold">المستوى 1</span>
        </div>
        <canvas id="blocks-canvas" width="240" height="400" class="rounded-xl bg-navy-950 border border-slate-700"></canvas>
        <!-- TOUCH CONTROLS -->
        <div class="grid grid-cols-4 gap-2 w-full max-w-xs mt-3">
          <button onclick="blocksMove(1)" class="py-3 rounded-xl bg-navy-800 active:bg-purple-600 text-white font-black text-lg">◀</button>
          <button onclick="blocksRotate()" class="py-3 rounded-xl bg-purple-600 active:bg-purple-500 text-white font-black text-sm">تدوير ↻</button>
          <button onclick="blocksDrop()" class="py-3 rounded-xl bg-navy-800 active:bg-purple-600 text-white font-black text-lg">▼</button>
          <button onclick="blocksMove(-1)" class="py-3 rounded-xl bg-navy-800 active:bg-purple-600 text-white font-black text-lg">▶</button>
        </div>
      </div>
    </div>
  `;
  startBlocksGame(blocksMode);
}

const TETROMINOS = [
  { shape: [[1,1,1,1]], color: '#06b6d4' },
  { shape: [[1,1],[1,1]], color: '#facc15' },
  { shape: [[0,1,0],[1,1,1]], color: '#a855f7' },
  { shape: [[1,0,0],[1,1,1]], color: '#3b82f6' },
  { shape: [[0,0,1],[1,1,1]], color: '#f97316' },
  { shape: [[0,1,1],[1,1,0]], color: '#22c55e' },
  { shape: [[1,1,0],[0,1,1]], color: '#ef4444' }
];

function startBlocksGame(mode) {
  blocksMode = mode;
  if (blocksLoopId) cancelAnimationFrame(blocksLoopId);
  const cols = 10, rows = 17;
  const grid = Array.from({ length: rows }, () => Array(cols).fill(null));
  const spawn = () => {
    const t = TETROMINOS[Math.floor(Math.random() * TETROMINOS.length)];
    return { shape: t.shape.map(r => [...r]), color: t.color, x: 3, y: 0 };
  };
  blocksState = {
    cols, rows, grid,
    piece: spawn(),
    score: 0,
    lines: 0,
    level: 1,
    lastDrop: performance.now(),
    startTime: performance.now(),
    over: false,
    spawn
  };

  const loop = (now) => {
    if (currentRoute !== 'blocks' || !blocksState || blocksState.over) return;
    if (blocksMode === 'timed') {
      const rem = Math.max(0, 90 - Math.floor((now - blocksState.startTime) / 1000));
      const ex = document.getElementById('blk-extra');
      if (ex) ex.textContent = `⏱ ${rem} ثانية`;
      if (rem <= 0) {
        finishBlocksGame();
        return;
      }
    }
    const speed = blocksMode === 'challenge'
      ? Math.max(140, 620 - blocksState.level * 55)
      : Math.max(180, 680 - blocksState.level * 40);
    if (now - blocksState.lastDrop > speed) {
      blocksStepDown();
      blocksState.lastDrop = now;
    }
    drawBlocksCanvas();
    blocksLoopId = requestAnimationFrame(loop);
  };
  blocksLoopId = requestAnimationFrame(loop);
}

function blocksValid(shape, nx, ny) {
  const { cols, rows, grid } = blocksState;
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (!shape[r][c]) continue;
      const gx = nx + c, gy = ny + r;
      if (gx < 0 || gx >= cols || gy >= rows) return false;
      if (gy >= 0 && grid[gy][gx]) return false;
    }
  }
  return true;
}

function blocksMove(dx) {
  if (!blocksState || blocksState.over) return;
  if (blocksValid(blocksState.piece.shape, blocksState.piece.x + dx, blocksState.piece.y)) {
    blocksState.piece.x += dx;
    playTone(320, 'sine', 0.03);
    drawBlocksCanvas();
  }
}

function blocksRotate() {
  if (!blocksState || blocksState.over) return;
  const s = blocksState.piece.shape;
  const rot = s[0].map((_, i) => s.map(row => row[i]).reverse());
  if (blocksValid(rot, blocksState.piece.x, blocksState.piece.y)) {
    blocksState.piece.shape = rot;
    playTone(460, 'triangle', 0.04);
    drawBlocksCanvas();
  }
}

function blocksDrop() {
  if (!blocksState || blocksState.over) return;
  blocksStepDown();
  drawBlocksCanvas();
}

function blocksStepDown() {
  const p = blocksState.piece;
  if (blocksValid(p.shape, p.x, p.y + 1)) {
    p.y++;
  } else {
    // Lock piece
    for (let r = 0; r < p.shape.length; r++) {
      for (let c = 0; c < p.shape[r].length; c++) {
        if (p.shape[r][c] && p.y + r >= 0) {
          blocksState.grid[p.y + r][p.x + c] = p.color;
        }
      }
    }
    // Clear lines
    let cleared = 0;
    for (let r = blocksState.rows - 1; r >= 0; r--) {
      if (blocksState.grid[r].every(cell => cell !== null)) {
        blocksState.grid.splice(r, 1);
        blocksState.grid.unshift(Array(blocksState.cols).fill(null));
        cleared++;
        r++;
      }
    }
    if (cleared > 0) {
      blocksState.lines += cleared;
      blocksState.score += cleared * 100 * cleared;
      blocksState.level = 1 + Math.floor(blocksState.lines / 5);
      playTone(660, 'sine', 0.12);
    }
    document.getElementById('blk-score').textContent = blocksState.score;
    document.getElementById('blk-lines').textContent = blocksState.lines;
    if (blocksMode !== 'timed') {
      document.getElementById('blk-extra').textContent = `المستوى ${blocksState.level}`;
    }
    blocksState.piece = blocksState.spawn();
    if (!blocksValid(blocksState.piece.shape, blocksState.piece.x, blocksState.piece.y)) {
      finishBlocksGame();
    }
  }
}

function finishBlocksGame() {
  blocksState.over = true;
  appState.blocks.gamesPlayed++;
  if (blocksMode === 'classic' && blocksState.score > appState.blocks.bestClassic) appState.blocks.bestClassic = blocksState.score;
  if (blocksMode === 'challenge' && blocksState.score > appState.blocks.bestChallenge) appState.blocks.bestChallenge = blocksState.score;
  if (blocksMode === 'timed' && blocksState.score > appState.blocks.bestTimed) appState.blocks.bestTimed = blocksState.score;
  saveState();
  playTone(220, 'sawtooth', 0.25);
  showToast(`انتهت الجولة! نتيجتك: ${blocksState.score} نقطة 🧩`);
}

function drawBlocksCanvas() {
  const canvas = document.getElementById('blocks-canvas');
  if (!canvas || !blocksState) return;
  const ctx = canvas.getContext('2d');
  const cell = 23.5;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Grid cells
  for (let r = 0; r < blocksState.rows; r++) {
    for (let c = 0; c < blocksState.cols; c++) {
      ctx.strokeStyle = 'rgba(148,163,184,0.08)';
      ctx.strokeRect(c * cell, r * cell, cell, cell);
      if (blocksState.grid[r][c]) {
        ctx.fillStyle = blocksState.grid[r][c];
        ctx.fillRect(c * cell + 1, r * cell + 1, cell - 2, cell - 2);
      }
    }
  }
  // Active piece
  const p = blocksState.piece;
  ctx.fillStyle = p.color;
  for (let r = 0; r < p.shape.length; r++) {
    for (let c = 0; c < p.shape[r].length; c++) {
      if (p.shape[r][c]) {
        ctx.fillRect((p.x + c) * cell + 1, (p.y + r) * cell + 1, cell - 2, cell - 2);
      }
    }
  }
}

   14. APP 07 — GOLF 2D (30 LEVELS + AI OPPONENT 10 DIFFICULTIES)
============================================================================ */
let golfLoopId = null;
let golfCurrentLevel = 1;
let golfVsAI = false;
let golfAIDiff = 3;
let golfState = null;

function renderGolf() {
  const container = document.getElementById('app-container');
  container.innerHTML = `
    <div class="animate-fade space-y-3">
      <div class="flex items-center justify-between gap-2 bg-white dark:bg-navy-900 border border-cyan-500/30 p-3 rounded-2xl">
        <div class="flex items-center gap-2">
          <span class="text-xs font-extrabold">المستوى:</span>
          <select onchange="golfCurrentLevel=parseInt(this.value); initGolfLevel()" class="px-2.5 py-1.5 rounded-xl bg-slate-100 dark:bg-navy-800 text-xs font-bold">
            ${Array.from({length: 30}, (_, i) => i + 1).map(lvl => `
              <option value="${lvl}" ${golfCurrentLevel===lvl?'selected':''}>ملعب ${lvl} ${appState.golf.stars[lvl] ? '★'.repeat(appState.golf.stars[lvl]) : ''}</option>
            `).join('')}
          </select>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="golfVsAI=!golfVsAI; initGolfLevel()" class="px-3 py-1.5 rounded-xl text-xs font-bold ${golfVsAI?'bg-cyan-600 text-white':'bg-slate-200 dark:bg-navy-800'}">
            ${golfVsAI ? '🤖 ضد الذكاء الاصطناعي' : '👤 لعب فردي'}
          </button>
          ${golfVsAI ? `
            <select onchange="golfAIDiff=parseInt(this.value)" class="px-2 py-1.5 rounded-xl bg-slate-100 dark:bg-navy-800 text-xs font-bold">
              ${Array.from({length:10},(_,i)=>i+1).map(d=>`<option value="${d}" ${golfAIDiff===d?'selected':''}>AI ${d}</option>`).join('')}
            </select>
          ` : ''}
        </div>
      </div>

      <div class="rounded-3xl bg-emerald-950 border-2 border-cyan-500/50 p-3 flex flex-col items-center">
        <div class="w-full flex items-center justify-between text-xs text-white px-2 mb-2">
          <span>ضرباتك: <strong id="golf-strokes" class="text-amber-300">0</strong></span>
          <span id="golf-status" class="text-cyan-300 font-bold">اسحب الكرة للخلف للتصويب ⛳</span>
          ${golfVsAI ? `<span>AI: <strong id="golf-ai-strokes" class="text-rose-300">0</strong></span>` : `<span>Par 3</span>`}
        </div>
        <canvas id="golf-canvas" width="320" height="420" class="rounded-2xl bg-emerald-900 border border-emerald-600/40 cursor-pointer"></canvas>
      </div>
    </div>
  `;
  initGolfLevel();
}

function initGolfLevel() {
  if (golfLoopId) cancelAnimationFrame(golfLoopId);
  const lvl = golfCurrentLevel;
  // Deterministic varied obstacles across 30 levels
  const walls = [];
  if (lvl >= 2) walls.push({ x: 80 + (lvl * 17) % 100, y: 210, w: 110, h: 14 });
  if (lvl >= 6) walls.push({ x: 40, y: 130, w: 90, h: 14 });
  if (lvl >= 12) walls.push({ x: 180, y: 290, w: 95, h: 14 });
  const sand = lvl >= 4 ? [{ x: 160, y: 165, r: 28 }] : [];

  golfState = {
    ball: { x: 160, y: 375, vx: 0, vy: 0, r: 8, inHole: false },
    aiBall: { x: 135, y: 375, vx: 0, vy: 0, r: 8, inHole: false },
    hole: { x: 60 + ((lvl * 53) % 200), y: 55, r: 13 },
    walls, sand,
    strokes: 0,
    aiStrokes: 0,
    dragging: false,
    dragX: 0, dragY: 0,
    turn: 'player'
  };

  const canvas = document.getElementById('golf-canvas');
  if (!canvas) return;
  const getPos = (e) => {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * (canvas.width / rect.width),
      y: (clientY - rect.top) * (canvas.height / rect.height)
    };
  };

  canvas.onpointerdown = (e) => {
    if (golfState.turn !== 'player' || Math.hypot(golfState.ball.vx, golfState.ball.vy) > 0.2) return;
    const p = getPos(e);
    if (Math.hypot(p.x - golfState.ball.x, p.y - golfState.ball.y) < 36) {
      golfState.dragging = true;
      golfState.dragX = p.x;
      golfState.dragY = p.y;
    }
  };
  canvas.onpointermove = (e) => {
    if (!golfState.dragging) return;
    const p = getPos(e);
    golfState.dragX = p.x;
    golfState.dragY = p.y;
  };
  canvas.onpointerup = () => {
    if (!golfState.dragging) return;
    golfState.dragging = false;
    const dx = golfState.ball.x - golfState.dragX;
    const dy = golfState.ball.y - golfState.dragY;
    const power = Math.min(14, Math.hypot(dx, dy) * 0.14);
    if (power > 1) {
      const ang = Math.atan2(dy, dx);
      golfState.ball.vx = Math.cos(ang) * power;
      golfState.ball.vy = Math.sin(ang) * power;
      golfState.strokes++;
      document.getElementById('golf-strokes').textContent = golfState.strokes;
      playTone(420, 'sine', 0.08);
      if (golfVsAI) golfState.turn = 'player_moving';
    }
  };

  const updatePhysics = (b) => {
    if (b.inHole) return;
    b.x += b.vx;
    b.y += b.vy;
    let friction = 0.975;
    golfState.sand.forEach(s => {
      if (Math.hypot(b.x - s.x, b.y - s.y) < s.r) friction = 0.91;
    });
    b.vx *= friction;
    b.vy *= friction;
    if (Math.hypot(b.vx, b.vy) < 0.12) { b.vx = 0; b.vy = 0; }

    // Bounds
    if (b.x < b.r) { b.x = b.r; b.vx *= -0.8; }
    if (b.x > canvas.width - b.r) { b.x = canvas.width - b.r; b.vx *= -0.8; }
    if (b.y < b.r) { b.y = b.r; b.vy *= -0.8; }
    if (b.y > canvas.height - b.r) { b.y = canvas.height - b.r; b.vy *= -0.8; }

    // Walls
    golfState.walls.forEach(w => {
      if (b.x + b.r > w.x && b.x - b.r < w.x + w.w && b.y + b.r > w.y && b.y - b.r < w.y + w.h) {
        b.vy *= -0.85;
        b.y += b.vy * 2;
      }
    });

    // Hole check
    if (Math.hypot(b.x - golfState.hole.x, b.y - golfState.hole.y) < golfState.hole.r && Math.hypot(b.vx, b.vy) < 7) {
      b.inHole = true;
      b.vx = 0; b.vy = 0;
    }
  };

  const step = () => {
    if (currentRoute !== 'golf' || !golfState) return;
    updatePhysics(golfState.ball);
    if (golfVsAI) updatePhysics(golfState.aiBall);

    if (golfState.ball.inHole) {
      const stars = golfState.strokes <= 2 ? 3 : (golfState.strokes <= 4 ? 2 : 1);
      appState.golf.stars[golfCurrentLevel] = Math.max(appState.golf.stars[golfCurrentLevel] || 0, stars);
      if (golfCurrentLevel < 30) appState.golf.unlockedLevel = Math.max(appState.golf.unlockedLevel, golfCurrentLevel + 1);
      saveState();
      playTone(740, 'triangle', 0.25);
      showToast(`هدف رائع في ${golfState.strokes} ضربات! (${'★'.repeat(stars)}) ⛳`);
      if (golfCurrentLevel < 30) {
        golfCurrentLevel++;
        renderGolf();
        return;
      }
    }

    // AI Turn trigger
    if (golfVsAI && golfState.turn === 'player_moving' && golfState.ball.vx === 0 && golfState.ball.vy === 0) {
      golfState.turn = 'ai';
      setTimeout(() => {
        if (!golfState || golfState.aiBall.inHole) return;
        const dx = golfState.hole.x - golfState.aiBall.x;
        const dy = golfState.hole.y - golfState.aiBall.y;
        const spread = (11 - golfAIDiff) * 0.04;
        const ang = Math.atan2(dy, dx) + (Math.random() - 0.5) * spread;
        const spd = Math.min(12, Math.hypot(dx, dy) * 0.042);
        golfState.aiBall.vx = Math.cos(ang) * spd;
        golfState.aiBall.vy = Math.sin(ang) * spd;
        golfState.aiStrokes++;
        const el = document.getElementById('golf-ai-strokes');
        if (el) el.textContent = golfState.aiStrokes;
        golfState.turn = 'player';
      }, 450);
    }

    drawGolfCanvas();
    golfLoopId = requestAnimationFrame(step);
  };
  golfLoopId = requestAnimationFrame(step);
}

function drawGolfCanvas() {
  const canvas = document.getElementById('golf-canvas');
  if (!canvas || !golfState) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Sand
  golfState.sand.forEach(s => {
    ctx.fillStyle = '#eab308';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });

  // Hole & Flag
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.arc(golfState.hole.x, golfState.hole.y, golfState.hole.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#ef4444';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(golfState.hole.x, golfState.hole.y);
  ctx.lineTo(golfState.hole.x, golfState.hole.y - 26);
  ctx.stroke();
  ctx.fillStyle = '#ef4444';
  ctx.fillRect(golfState.hole.x, golfState.hole.y - 26, 14, 9);

  // Walls
  ctx.fillStyle = '#cbd5e1';
  golfState.walls.forEach(w => ctx.fillRect(w.x, w.y, w.w, w.h));

  // Drag line
  if (golfState.dragging) {
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(golfState.ball.x, golfState.ball.y);
    ctx.lineTo(golfState.dragX, golfState.dragY);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // AI Ball
  if (golfVsAI && !golfState.aiBall.inHole) {
    ctx.fillStyle = '#fb7185';
    ctx.beginPath();
    ctx.arc(golfState.aiBall.x, golfState.aiBall.y, golfState.aiBall.r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Player Ball
  if (!golfState.ball.inHole) {
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(golfState.ball.x, golfState.ball.y, golfState.ball.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function togglePomo() {
  pomoRunning = !pomoRunning;
  if (pomoRunning) {
    clearActiveIntervals();
    activeInterval = setInterval(() => {
      pomoSeconds--;
      const el = document.getElementById('pomo-display');
      if (el) el.textContent = formatSeconds(pomoSeconds);
      if (pomoSeconds <= 0) {
        pomoRunning = false;
        clearActiveIntervals();
        pomoSeconds = 25 * 60;
        appState.study.pomodoroCompleted++;
        saveState();
        playTone(760, 'triangle', 0.3);
        showToast('أحسنت! أتممت جلسة تركيز 25 دقيقة 📚');
        renderStudy();
      }
    }, 1000);
  } else {
    clearActiveIntervals();
  }
  renderStudy();
}

function addStudyTask() {
  const inp = document.getElementById('new-study-task');
  if (!inp || !inp.value.trim()) return;
  appState.study.tasks.push({ id: Date.now(), text: inp.value.trim(), done: false });
  saveState();
  renderStudy();
}

function openStoryReader(storyId, chapIdx = 0) {
  activeStoryId = storyId;
  activeChapterIdx = chapIdx;
  storiesTab = 'reader';
  appState.stories.readCounts[storyId] = (appState.stories.readCounts[storyId] || 0) + 1;
  saveState();
  playTone(520, 'sine', 0.08);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  renderStories();
}

function adjustStoryFont(delta) {
  appState.stories.fontSize = Math.min(26, Math.max(14, appState.stories.fontSize + delta));
  saveState();
  renderStories();
}

function adjustStoryLineHeight() {
  const heights = [1.75, 1.95, 2.2];
  const nextIdx = (heights.indexOf(appState.stories.lineHeight) + 1) % heights.length;
  appState.stories.lineHeight = heights[nextIdx];
  saveState();
  renderStories();
}

let rgCatFilter = 'الكل';
let rgPlayersFilter = 'الكل';
let rgSearch = '';
let rgSelectedGameId = null;
let rgTab = 'discover'; // 'discover' | 'all' | 'favorites'

function getFilteredRandomGames() {
  return RANDOM_GAMES_DB.filter(g => {
    const cOk = rgCatFilter === 'الكل' || g.cat === rgCatFilter;
    let pOk = true;
    if (rgPlayersFilter === '1 لاعب') pOk = g.pCount.includes(1);
    else if (rgPlayersFilter === '2 لاعبين') pOk = g.pCount.includes(2);
    else if (rgPlayersFilter === '3 لاعبين') pOk = g.pCount.includes(3);
    else if (rgPlayersFilter === '4 لاعبين') pOk = g.pCount.includes(4);
    else if (rgPlayersFilter === '+4 جماعية') pOk = g.pCount.includes(5);
    const q = rgSearch.trim();
    const qOk = !q || g.name.includes(q) || g.desc.includes(q) || g.cat.includes(q);
    return cOk && pOk && qOk;
  });
}

function pickRandomGame(preferUnplayed = false) {
  const pool = getFilteredRandomGames();
  if (pool.length === 0) {
    showToast('لا توجد ألعاب مطابقة للفلتر الحالي');
    return;
  }
  let candidates = pool;
  if (preferUnplayed) {
    const unplayed = pool.filter(g => !appState.randomGames.playedHistory.includes(g.id));
    if (unplayed.length > 0) candidates = unplayed;
    else showToast('لقد جربت جميع الألعاب في هذا التصنيف! سنختار لك لعبة عشوائية');
  }
  const chosen = candidates[Math.floor(Math.random() * candidates.length)];
  rgSelectedGameId = chosen.id;
  if (!appState.randomGames.playedHistory.includes(chosen.id)) {
    appState.randomGames.playedHistory.push(chosen.id);
    saveState();
  }
  playTone(620, 'triangle', 0.1);
  renderRandomGames();
}

        </button>
      </div>
    `;

function playXO(idx) {
  if (xoBoard[idx]) return;
  xoBoard[idx] = xoTurn;
  document.getElementById('xo-cell-' + idx).textContent = xoTurn;
  playTone(xoTurn === 'X' ? 500 : 380, 'sine', 0.06);
  const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const won = wins.some(([a,b,c]) => xoBoard[a] && xoBoard[a] === xoBoard[b] && xoBoard[a] === xoBoard[c]);
  if (won) {
    document.getElementById('xo-status').textContent = `🎉 فاز اللاعب ${xoTurn}!`;
    xoBoard = Array(9).fill(' ');
    return;
  }
  xoTurn = xoTurn === 'X' ? 'O' : 'X';
  document.getElementById('xo-status').textContent = `دور اللاعب: ${xoTurn}`;
}

function checkGuessNum() {
  const val = parseInt(document.getElementById('guess-inp').value);
  if (!val) return;
  guessTries++;
  const hint = document.getElementById('guess-hint');
  if (val === guessSecret) {
    hint.textContent = `🎉 أحسنت! الرقم هو ${guessSecret} (في ${guessTries} محاولات)`;
    playTone(720, 'triangle', 0.2);
  } else if (val < guessSecret) {
    hint.textContent = `⬆️ الرقم السري أكبر من ${val} (محاولة ${guessTries})`;
  } else {
    hint.textContent = `⬇️ الرقم السري أصغر من ${val} (محاولة ${guessTries})`;
  }
}

function checkMathBlitz() {
  const val = parseInt(document.getElementById('math-ans').value);
  if (val === mathA * mathB) {
    mathStreak++;
    playTone(660, 'sine', 0.08);
    document.getElementById('math-streak').textContent = mathStreak;
    mathA = Math.floor(Math.random() * 16) + 4;
    mathB = Math.floor(Math.random() * 12) + 3;
    document.getElementById('math-q').textContent = `${mathA} × ${mathB} = ؟`;
    document.getElementById('math-ans').value = '';
  } else {
    showToast('حاول مرة أخرى!');
  }
}

let reactState = 'idle';
let reactStart = 0;
function handleReactionClick() {
  const btn = document.getElementById('react-box');
  if (!btn) return;
  if (reactState === 'idle') {
    reactState = 'waiting';
    btn.className = 'w-full py-8 rounded-2xl bg-amber-500 text-navy-950 font-black text-sm';
    btn.textContent = 'استعد... انتظر اللون الأخضر!';
    setTimeout(() => {
      if (reactState === 'waiting') {
        reactState = 'ready';
        reactStart = performance.now();
        btn.className = 'w-full py-8 rounded-2xl bg-emerald-500 text-white font-black text-base';
        btn.textContent = 'اضغط الآن!!';
      }
    }, 1200 + Math.random() * 2000);
  } else if (reactState === 'ready') {
    const ms = Math.round(performance.now() - reactStart);
    reactState = 'idle';
    btn.className = 'w-full py-8 rounded-2xl bg-blue-600 text-white font-black text-sm';
    btn.textContent = `⚡ سرعتك: ${ms} مللي ثانية! (اضغط للإعادة)`;
    playTone(700, 'sine', 0.1);
  }
}

                  <p class="text-amber-600 dark:text-amber-400">${v.ajuz}</p>
                </div>
                <div class="flex items-center justify-between pt-2 border-t border-slate-100 dark:border-slate-800 text-xs">
                  <button onclick="poetryPoetFilter='${v.poet}'; renderPoetry()" class="font-bold text-slate-600 dark:text-slate-300 hover:text-amber-400">✍️ ${v.poet} (${v.era})</button>
                  <div class="flex items-center gap-1.5">
                    <button onclick="openPoemReader('${v.poemId}')" class="px-2.5 py-1 rounded-lg bg-amber-500/15 text-amber-400 font-bold">القصيدة</button>
                    <button onclick="copyToClipboard('${v.sadr} — ${v.ajuz} (${v.poet})')" class="w-7 h-7 rounded-lg bg-slate-100 dark:bg-navy-800">📋</button>
                    <button onclick="toggleFavorite('poetryVerses', '${v.id}'); renderPoetry()" class="w-7 h-7 rounded-lg bg-slate-100 dark:bg-navy-800">${isFav?'⭐':'☆'}</button>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
          ${filteredVerses.length > versesLimit ? `
            <button onclick="versesLimit += 40; renderPoetry()" class="w-full py-3 rounded-2xl bg-amber-500 text-navy-950 text-xs font-black">
              عرض المزيد من الأبيات (${filteredVerses.length - versesLimit} متبقٍ)
            </button>
          ` : ''}
        </div>
      ` : poetryTab === 'poems' ? `
        <div class="space-y-3">
          ${filteredPoems.slice(0, poemsLimit).map(p => {
            const isFav = appState.favorites.poetryPoems.includes(p.id);
            return `
              <div class="rounded-2xl bg-white dark:bg-navy-900 border border-slate-200 dark:border-slate-800 p-4 flex items-center justify-between gap-3">
                <div class="min-w-0">
                  <div class="flex items-center gap-1.5 mb-1">
                    <span class="px-2 py-0.5 rounded-md bg-amber-500/15 text-amber-400 text-[10px] font-bold">${p.era}</span>
                    <span class="px-2 py-0.5 rounded-md bg-slate-100 dark:bg-navy-800 text-[10px] font-bold">${p.type}</span>
                  </div>
                  <h4 class="text-sm font-black truncate">${p.title}</h4>
                  <p class="text-xs text-slate-500 dark:text-slate-400">الشاعر: ${p.poet} • ${p.verses.length} أبيات</p>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                  <button onclick="toggleFavorite('poetryPoems', '${p.id}'); renderPoetry()" class="w-8 h-8 rounded-xl bg-slate-100 dark:bg-navy-800 text-sm">${isFav?'⭐':'☆'}</button>
                  <button onclick="openPoemReader('${p.id}')" class="px-3.5 py-2 rounded-xl bg-amber-500 text-navy-950 text-xs font-black">قراءة</button>
                </div>
              </div>
            `;
          }).join('')}
          ${filteredPoems.length > poemsLimit ? `
            <button onclick="poemsLimit += 25; renderPoetry()" class="w-full py-3 rounded-2xl bg-amber-500 text-navy-950 text-xs font-black">
              عرض المزيد من القصائد (${filteredPoems.length - poemsLimit} متبقية)
            </button>
          ` : ''}
        </div>
      ` : `
        <div class="space-y-3">
          <h4 class="text-xs font-black text-amber-400">⭐ القصائد المفضلة (${appState.favorites.poetryPoems.length})</h4>
          ${appState.favorites.poetryPoems.map(pid => {
            const p = POETRY_DB.find(x => x.id === pid);
            if (!p) return '';
            return `<div onclick="openPoemReader('${p.id}')" class="cursor-pointer p-3 rounded-xl bg-white dark:bg-navy-900 border border-slate-200 dark:border-slate-800 flex justify-between text-xs font-bold"><span>${p.title} — ${p.poet}</span><span>قراءة ←</span></div>`;
          }).join('') || '<p class="text-xs text-slate-400">لا توجد قصائد مفضلة بعد.</p>'}
          <h4 class="text-xs font-black text-amber-400 pt-2">💎 الأبيات المفضلة (${appState.favorites.poetryVerses.length})</h4>
          ${appState.favorites.poetryVerses.map(vid => {
            const v = STANDALONE_VERSES_DB.find(x => x.id === vid);
            if (!v) return '';
            return `<div class="p-3 rounded-xl bg-white dark:bg-navy-900 border border-slate-200 dark:border-slate-800 text-xs"><p class="font-bold poetry-font text-base">${v.sadr} — ${v.ajuz}</p><span class="text-slate-400">${v.poet}</span></div>`;
          }).join('') || '<p class="text-xs text-slate-400">لا توجد أبيات مفضلة بعد.</p>'}
        </div>
      `}
    </div>
  `;
}

function openPoemReader(poemId) {
  activePoemId = poemId;
  poetryTab = 'reader';
  playTone(540, 'sine', 0.08);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  renderPoetry();
}

============================================================================ */

      </div>

      ${total === 0 ? `

        </div>

          ${f.randomGames.length ? `<div class="p-4 rounded-2xl bg-white dark:bg-navy-900 border border-fuchsia-500/30"><h4 class="text-xs font-black text-fuchsia-400 mb-2">🎮 الألعاب المفضلة (${f.randomGames.length})</h4>${f.randomGames.map(id => { const g = RANDOM_GAMES_DB.find(x=>x.id===id); return g ? `<div onclick="launchApp('random-games'); openGameDetailModal('${g.id}')" class="cursor-pointer py-1.5 text-xs font-bold border-b border-slate-100 dark:border-slate-800">• ${g.name}</div>` : ''; }).join('')}</div>` : ''}
          ${(f.poetryPoems.length + f.poetryVerses.length) ? `<div class="p-4 rounded-2xl bg-white dark:bg-navy-900 border border-amber-500/30"><h4 class="text-xs font-black text-amber-400 mb-2">📜 الشعر المفضل (${f.poetryPoems.length + f.poetryVerses.length})</h4>${f.poetryPoems.map(id => { const p = POETRY_DB.find(x=>x.id===id); return p ? `<div onclick="launchApp('poetry'); openPoemReader('${p.id}')" class="cursor-pointer py-1.5 text-xs font-bold border-b border-slate-100 dark:border-slate-800">• ${p.title} (${p.poet})</div>` : ''; }).join('')}</div>` : ''}
          ${f.health.length ? `<div class="p-4 rounded-2xl bg-white dark:bg-navy-900 border border-rose-500/30"><h4 class="text-xs font-black text-rose-400 mb-2">🏥 الصحة (${f.health.length})</h4>${f.health.map(id => { const d = HEALTH_DISEASES.find(x=>x.id===id); return d ? `<div class="py-1 text-xs">• ${d.name}</div>` : ''; }).join('')}</div>` : ''}
          ${f.gym.length ? `<div class="p-4 rounded-2xl bg-white dark:bg-navy-900 border border-orange-500/30"><h4 class="text-xs font-black text-orange-400 mb-2">🏋️ التمارين (${f.gym.length})</h4>${f.gym.map(id => { const e = GYM_EXERCISES.find(x=>x.id===id); return e ? `<div class="py-1 text-xs">• ${e.name}</div>` : ''; }).join('')}</div>` : ''}
          ${f.tips.length ? `<div class="p-4 rounded-2xl bg-white dark:bg-navy-900 border border-amber-500/30"><h4 class="text-xs font-black text-amber-400 mb-2">💡 النصائح (${f.tips.length})</h4>${f.tips.map(id => { const t = DAILY_TIPS_DB.find(x=>x.id===id); return t ? `<div class="py-1 text-xs">• ${t.title}</div>` : ''; }).join('')}</div>` : ''}
